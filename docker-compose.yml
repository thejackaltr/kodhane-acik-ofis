# Dokploy (project "acikofis"): builds the Dockerfile and serves the game on teserix_network.
# The Cloudflare Tunnel (teserix-apps) routes acikofis.teserix.com to http://acikofis-web:80.
services:
  web:
    build: .
    restart: unless-stopped
    mem_limit: 64m
    networks:
      teserix_network:
        aliases:
          - acikofis-web

networks:
  teserix_network:
    external: true
